services:
  eliza-dev:
    build:
      context: ../../..
      dockerfile: docker/targets/dev/Dockerfile
    image: elizaos:development
    container_name: elizaos-dev
    ports:
      - "3000:3000"     # Main app
      - "3001:3001"     # Client dev server
      - "5173:5173"     # Vite
      - "9229:9229"     # Node debugger
    environment:
      # Development defaults (can be overridden)
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - ELIZA_UI_ENABLE=true
      
      # AI Provider Keys (from .env.local or environment)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Optional overrides
      - POSTGRES_URL=${POSTGRES_URL:-}
      - ELIZA_SERVER_AUTH_TOKEN=${ELIZA_SERVER_AUTH_TOKEN:-}
      
      # Development specific
      - DEV_MODE=true
      - WATCH_MODE=true
      - DEBUG=eliza:*
      
    volumes:
      # Mount source code for hot reload
      - ..:/app:delegated
      
      # Mount .env.local if it exists
      - ./.env.local:/home/eliza/agent/.env.local:ro
      
      # Persist agent data
      - eliza_dev_data:/home/eliza/agent/data
      
      # Persist node_modules for faster rebuilds
      - eliza_node_modules:/app/node_modules
      - eliza_bun_cache:/home/eliza/.bun/install/cache
      
    restart: unless-stopped
    
    # Development-friendly settings
    stdin_open: true
    tty: true
    
    # Override command for debugging if needed
    # command: ["bun", "run", "dev:debug"]

volumes:
  eliza_dev_data:
  eliza_node_modules:
  eliza_bun_cache: